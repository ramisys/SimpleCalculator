<!DOCTYPE html>

<html>
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
     .wrapper {
       display: flex;
       align-items: center;
       justify-content: center;
     }

     .calculator-container {
        width: 300px;
        height: 400px;
        border: 2px solid #333;
        border-radius: 10px;
        background: linear-gradient(to right, lightblue, lightgreen);
        margin: 20px;
     }

     .digit-container {
        width: 270px;
        height: 50px;
        margin: 15px;
        margin-bottom: 25px;
        border: 2px solid #333; /* Dark charcoal border */
        border-radius: 10px;
        box-sizing: border-box;
        background: linear-gradient(45deg, lightblue, #ffcc99);
        font-size: 24px;
        padding: 10px;
        text-align: right; /* Align text to the right */
        line-height: 50px; /* Vertically center the text */
     }

     .button-container {
        border-left: 25px;
        border-right: 25px;
     }

     .button {
        display: flex;
        justify-content: center;
        align-items: center;
     }

     .button button {
        font-family: 'Roboto Mono', monospace;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        margin: 5px;
        border: 2px solid #333;
     }
  </style>
  <title>Calculator</title>
</head>
<body>
  
  <div class="wrapper">
    <div class="calculator-container">
     <div class="digit-container">0</div>
      <div class="button-container">
       <div class="button">
        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button>+</button>
        </div>
      <div class="button">
        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button>-</button>
      </div>
      <div class="button">
        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button>*</button>
      </div>
      <div class="button">
        <button>AC</button>
        <button>0</button>
        <button>÷</button>
        <button>=</button>
      </div>
     </div>
    </div>
  </div>
  <script>
  // Select the digit container and all buttons
const digitContainer = document.querySelector('.digit-container');
const buttons = document.querySelectorAll('.button-container button');

// Initialize the display to show 0 initially
digitContainer.textContent = '0';

const OPERATORS = new Set(['+', '-', '*', '÷', '/']);

function isOperator(char) {
  return OPERATORS.has(char);
}

function normalizeExpression(expression) {
  // Replace all occurrences of ÷ with /
  return expression.replace(/÷/g, '/');
}

function getPrecedence(operator) {
  if (operator === '+' || operator === '-') return 1;
  if (operator === '*' || operator === '/') return 2;
  return 0;
}

function applyOperation(leftOperand, rightOperand, operator) {
  switch (operator) {
    case '+':
      return leftOperand + rightOperand;
    case '-':
      return leftOperand - rightOperand;
    case '*':
      return leftOperand * rightOperand;
    case '/':
      if (rightOperand === 0) throw new Error('Division by zero');
      return leftOperand / rightOperand;
    default:
      throw new Error('Invalid operator');
  }
}

function evaluateExpression(expression) {
  // Security fix: avoid eval by using a simple shunting-yard based evaluator
  const expr = normalizeExpression(expression);

  const values = [];
  const ops = [];
  let numberBuffer = '';

  const flushNumber = () => {
    if (numberBuffer.length > 0) {
      values.push(Number(numberBuffer));
      numberBuffer = '';
    }
  };

  for (let i = 0; i < expr.length; i += 1) {
    const ch = expr[i];

    if (/\d/.test(ch)) {
      numberBuffer += ch;
      continue;
    }

    if (isOperator(ch)) {
      // Prevent malformed expressions like leading or double operators
      flushNumber();
      while (
        ops.length > 0 && getPrecedence(ops[ops.length - 1]) >= getPrecedence(ch)
      ) {
        const op = ops.pop();
        const right = values.pop();
        const left = values.pop();
        values.push(applyOperation(left, right, op));
      }
      ops.push(ch === '÷' ? '/' : ch);
      continue;
    }

    if (ch === ' ') {
      continue;
    }

    throw new Error('Invalid character');
  }

  flushNumber();

  while (ops.length > 0) {
    const op = ops.pop();
    const right = values.pop();
    const left = values.pop();
    values.push(applyOperation(left, right, op));
  }

  if (values.length !== 1 || Number.isNaN(values[0])) {
    throw new Error('Invalid expression');
  }

  return values[0];
}

// Add click event listeners to each button
buttons.forEach((button) => {
  button.addEventListener('click', () => {
    const buttonValue = button.textContent;

    if (buttonValue === 'AC') {
      digitContainer.textContent = '0';
      return;
    }

    if (buttonValue === '=') {
      try {
        const result = evaluateExpression(digitContainer.textContent);
        if (result === 143) {
          digitContainer.textContent = 'I miss you :(';
        } else {
          // Trim trailing .0 for integers
          const normalized = Number.isInteger(result) ? result.toString() : String(result);
          digitContainer.textContent = normalized;
        }
      } catch (error) {
        digitContainer.textContent = 'Error';
      }
      return;
    }

    // Handle numbers and operators
    const isNumber = !Number.isNaN(Number(buttonValue));

    if (isNumber) {
      // Replace initial 0 with the first number pressed
      if (digitContainer.textContent === '0') {
        digitContainer.textContent = buttonValue;
      } else {
        digitContainer.textContent += buttonValue;
      }
      return;
    }

    if (isOperator(buttonValue)) {
      const current = digitContainer.textContent;
      const lastChar = current[current.length - 1];

      // Prevent starting with an operator or stacking operators
      if (current === '0') return; // do not allow operator as the first input

      if (isOperator(lastChar)) {
        // Replace the last operator with the new one (prevents consecutive operators)
        digitContainer.textContent = current.slice(0, -1) + buttonValue;
      } else {
        digitContainer.textContent += buttonValue;
      }
      return;
    }
  });
});
  </script>
</body>
</html>
